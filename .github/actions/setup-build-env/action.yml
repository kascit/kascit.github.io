---
name: Setup Build Environment
description: Common setup steps for CI, deploy, and lint workflows.

inputs:
  install-imagemagick:
    description: "Whether to install ImageMagick (build workflows need it, lint does not)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Load tool versions
      id: versions
      shell: bash
      run: |
        grep -vE '^(#|$)' versions.env >> "$GITHUB_ENV"
        grep -vE '^(#|$)' versions.env | while IFS='=' read -r key value; do
          echo "${key}=${value}" >> "$GITHUB_OUTPUT"
        done

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: "20"

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Activate pnpm
      shell: bash
      run: corepack prepare pnpm@${{ steps.versions.outputs.PNPM_VERSION }} --activate

    - name: Cache npm downloads
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.npm
        key: npm-tools-${{ runner.os }}-${{ steps.versions.outputs.TERSER_VERSION }}-${{ steps.versions.outputs.ESBUILD_VERSION }}
        restore-keys: |
          npm-tools-${{ runner.os }}-

    - name: Cache pnpm store
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-tools-${{ runner.os }}-${{ steps.versions.outputs.PNPM_VERSION }}-${{ steps.versions.outputs.ESLINT_VERSION }}-${{ steps.versions.outputs.STYLELINT_VERSION }}
        restore-keys: |
          pnpm-tools-${{ runner.os }}-

    - name: Install system packages
      shell: bash
      run: |
        if command -v apt-get &>/dev/null; then
          pkgs=()
          command -v xmllint &>/dev/null || pkgs+=(libxml2-utils)
          if [[ "${{ inputs.install-imagemagick }}" == "true" ]]; then
            command -v convert &>/dev/null || pkgs+=(imagemagick librsvg2-bin)
          fi
          if [[ ${#pkgs[@]} -gt 0 ]]; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y "${pkgs[@]}"
          fi
        elif command -v brew &>/dev/null; then
          if ! command -v xmllint &>/dev/null; then
            brew install libxml2
          fi
          if [[ "${{ inputs.install-imagemagick }}" == "true" ]] && ! command -v convert &>/dev/null; then
            brew install imagemagick librsvg
          fi
        fi

    - name: Cache just binary
      id: cache-just
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.cargo/bin/just
        key: just-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.JUST_VERSION }}

    - name: Install just
      if: steps.cache-just.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@1ed3272338f573e042a2e6bca3893aa19f43b47a # v2
      with:
        tool: just@${{ steps.versions.outputs.JUST_VERSION }}

    - name: Cache Zola binary
      id: cache-zola
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.install-action/bin/zola
        key: zola-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.ZOLA_VERSION }}

    - name: Install Zola
      if: steps.cache-zola.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.install-action/bin"
        zola_ver="${{ steps.versions.outputs.ZOLA_VERSION }}"
        os_name="unknown-linux-gnu"
        arch_name="x86_64"
        uname_s="$(uname -s | tr '[:upper:]' '[:lower:]')"
        uname_m="$(uname -m)"
        if [ "$uname_s" = "darwin" ]; then
          os_name="apple-darwin"
        fi
        if [ "$uname_m" = "aarch64" ] || [ "$uname_m" = "arm64" ]; then
          arch_name="aarch64"
        fi
        url="https://github.com/getzola/zola/releases/download/v${zola_ver}/zola-v${zola_ver}-${arch_name}-${os_name}.tar.gz"
        echo "Downloading Zola v${zola_ver} from ${url}..."
        curl -sSL "$url" | tar -xz -C "$HOME/.install-action/bin"
        chmod +x "$HOME/.install-action/bin/zola"

    - name: Add zola to PATH
      shell: bash
      run: echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"

    - name: Cache CSS build dependencies
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          tools/tailwindcss
          src/vendor/daisyui.js
          src/vendor/daisyui-theme.js
        key: css-build-${{ steps.versions.outputs.TAILWIND_VERSION }}-${{ steps.versions.outputs.DAISYUI_VERSION }}
