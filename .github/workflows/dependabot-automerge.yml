---
name: Auto-Merge Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable Automated Auto-Merge
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'github-actions[bot]' ||
      startsWith(github.head_ref, 'chore/') ||
      startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Approve and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved automated workflow PR." || true
          gh pr merge "$PR_URL" --auto --squash --delete-branch || true

