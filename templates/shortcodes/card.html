{% component card(title: string = "", img: string = "", badge: string = "", badge_color: string = "primary") %}
<div class="card bg-base-200/40 border border-base-300/30 my-6">
  {% if img != "" %}
  <figure class="px-4 pt-4">
    <img
      src="{{ img }}"
      alt="{% if title != '' %}{{ title }}{% else %}Card image{% endif %}"
      class="rounded-md"
      sizes="(min-width: 1024px) 768px, 100vw"
      loading="lazy"
    />
  </figure>
  {% endif %}
  <div class="card-body">
    {% if title != "" %}
    <h3 class="card-title text-lg">
      {{ title }} {% if badge != "" %}
      <span
        class="badge badge-{{ badge_color }} badge-sm"
        >{{ badge }}</span
      >
      {% endif %}
    </h3>
    {% endif %}
    <div class="text-base-content/80 text-sm">{{ body | markdown | safe }}</div>
  </div>
</div>
{% endcomponent card %}
