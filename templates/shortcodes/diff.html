{% component diff(remove: string = "", add: string = "") %}
<div
  class="diff aspect-auto my-6 rounded-box overflow-hidden border border-base-content/10"
>
  <div class="diff-item-1">
    <div class="bg-error/10 p-4 font-mono text-sm">
      {{ remove }}
    </div>
  </div>
  <div class="diff-item-2">
    <div class="bg-success/10 p-4 font-mono text-sm">
      {{ add }}
    </div>
  </div>
  <div class="diff-resizer"></div>
</div>
{% endcomponent diff %}
