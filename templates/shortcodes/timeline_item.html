{% component timeline_item(title: string = "", date: string = "", icon: string = "", color: string = "") %}
<li>
  <hr {% if color != "" %}class="bg-{{ color }}" {% endif %} />
  <div class="timeline-start text-sm opacity-60">
    {{ date }}
  </div>
  <div class="timeline-middle">
    {% if icon != "" %}
    <i class="{{ icon }} text-sm"></i>
    {% else %}
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      class="w-5 h-5 {% if color != '' %}text-{{ color }}{% endif %}"
    >
      <path
        fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
        clip-rule="evenodd"
      />
    </svg>
    {% endif %}
  </div>
  <div class="timeline-end timeline-box">
    <div class="font-semibold">{{ title }}</div>
    {% if body %}
    <div class="text-sm opacity-75 mt-1">{{ body | markdown | safe }}</div>
    {% endif %}
  </div>
  <hr {% if color != "" %}class="bg-{{ color }}" {% endif %} />
</li>
{% endcomponent timeline_item %}
